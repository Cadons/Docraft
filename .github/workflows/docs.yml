name: Documentation

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'doc/**'
      - 'docraft/include/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    uses: ./.github/workflows/docs-build.yml
